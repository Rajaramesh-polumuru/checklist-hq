    <!-- ========== Structured Data: FAQPage ========== -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is Checklist HQ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Checklist HQ is the GitHub for Standard Operating Procedures. It lets teams version control their SOPs, fork proven templates from a community library, and track every change with full commit history. Think of it as Git, but for your business processes."
            }
          },
          {
            "@type": "Question",
            "name": "How does version control work for checklists?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Every change you make to a checklist is automatically saved as a commit. You can view the full history of changes, compare any two versions side by side, and roll back to a previous version at any time. This gives you a complete audit trail of how your processes evolve."
            }
          },
          {
            "@type": "Question",
            "name": "What does 'fork' mean in Checklist HQ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Forking lets you create your own copy of any public checklist template. You can then customize it to fit your team's needs while the original stays unchanged. It's the fastest way to get started — browse the community library, fork a template, and make it your own."
            }
          },
          {
            "@type": "Question",
            "name": "Is Checklist HQ free to use?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, Checklist HQ offers a free tier that lets you create checklists, fork templates, use version control, and run checklists. You can explore the full template library without even creating an account."
            }
          },
          {
            "@type": "Question",
            "name": "What are the main use cases for Checklist HQ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Teams use Checklist HQ for employee and customer onboarding, compliance and audit checklists, QA testing procedures, DevOps runbooks and incident response, standard operating procedures (SOPs), and any repeatable business workflow."
            }
          },
          {
            "@type": "Question",
            "name": "How is Checklist HQ different from other checklist tools?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Unlike basic checklist apps, Checklist HQ brings software engineering best practices to process management. You get version control with full commit history, forking and community templates, run mode with real-time progress tracking, and team collaboration — all inspired by how developers manage code on GitHub."
            }
          }
        ]
      }
    </script>
